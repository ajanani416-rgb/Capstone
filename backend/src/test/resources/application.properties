# Test-only datasource: H2 in-memory, Hibernate creates schema from entities,
# Flyway stays disabled (migrations are MySQL-dialect; MigrationTest runs them
# explicitly on its own H2).
spring.datasource.url=jdbc:h2:mem:salontest;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false
# Test-only OTP hook: lets API tests read issued codes without an inbox.
# (EmailSender is mocked per test class.)
app.otp.expose-last-code=true
