# Test-only datasource: H2 in-memory in PostgreSQL mode (mirrors the
# production dialect), Hibernate creates schema from entities, Flyway stays
# disabled (MigrationTest runs the real migrations explicitly on its own H2).
spring.datasource.url=jdbc:h2:mem:salontest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false
# Test-only OTP hook: lets API tests read issued codes without an inbox.
# (EmailSender is mocked per test class.)
app.otp.expose-last-code=true
