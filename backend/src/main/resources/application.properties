# Dev defaults only — real values come from environment (see .env.example).
# Never commit real credentials; hardcoded values below are local-dev fallbacks.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/salon_management}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}

# Flyway owns the schema (V1 baseline of docs/database-schema.md + V2 admin
# seed + V3 slot-unique + V4 OTP). Hibernate must not mutate it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# JWT (decision D1). JWT_SECRET must be set in any shared environment — the
# default below is dev-only and must be at least 32 chars for HS256.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-12345678}
app.jwt.expiry-ms=86400000

# Email OTP via SMTP (Gmail). All values are env-backed (see .env.example);
# nothing secret is committed. The app boots without credentials (the sender
# connects lazily) — registration answers EMAIL_SEND_FAILED until configured.
app.mail.host=${MAIL_HOST:smtp.gmail.com}
app.mail.port=${MAIL_PORT:587}
app.mail.username=${MAIL_USERNAME:}
app.mail.password=${MAIL_PASSWORD:}
app.mail.from=${MAIL_FROM:}
app.mail.from-name=${MAIL_FROM_NAME:Smart Salon}
# OTP policy: 10-minute TTL, 60-second resend cooldown, 5 attempts (code).
app.otp.ttl-minutes=${APP_OTP_TTL_MINUTES:10}
app.otp.resend-cooldown-seconds=${APP_OTP_RESEND_COOLDOWN_SECONDS:60}

server.port=${PORT:8080}
