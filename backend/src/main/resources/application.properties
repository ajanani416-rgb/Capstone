# Dev defaults only — real values come from environment (see .env.example).
# Never commit real credentials; hardcoded values below are local-dev fallbacks.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/salon_management}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}

# Flyway owns the schema (V1 baseline of docs/database-schema.md + V2 admin
# seed + V3 slot-unique + V4 OTP). Hibernate must not mutate it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# JWT (decision D1). JWT_SECRET must be set in any shared environment — the
# default below is dev-only and must be at least 32 chars for HS256.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-12345678}
app.jwt.expiry-ms=86400000

# SMS OTP. The console sender logs codes (demo/dev) and needs no config.
# A future gateway sender (Twilio, etc.) activates when app.sms.gateway is
# set — see OtpSmsConfig. No mail configuration remains (removed with V6).
app.otp.ttl-minutes=2

server.port=8080
