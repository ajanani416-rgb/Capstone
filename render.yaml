services:
  - type: web
    name: salon-backend
    runtime: java
    rootDir: backend
    buildCommand: mvn -DskipTests package
    startCommand: java -jar target/salon-management-system-0.0.1-SNAPSHOT.jar
    healthCheckPath: /api/health
    envVars:
      - key: JAVA_VERSION
        value: 17
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        value: Smart Salon
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173
